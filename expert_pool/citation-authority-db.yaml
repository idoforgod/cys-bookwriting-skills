# ═══════════════════════════════════════════════════════
# 매핑 정책 (citation-gate가 따르는 규칙)
# ═══════════════════════════════════════════════════════
matching_policy:
  match_priority:
    - author_pattern                      # 1순위 — 저자명
    - publication_pattern                 # 2순위 — 매체명
    - source_type                          # 3순위 — 출처 종류

  unmatched_handling:
    action: assign_temporary_grade_C       # 매칭 안 되면 임시 Grade C
    notify_user: true                      # 저자 알림 + DB 보강 권장
    log_path: _progress/citation-authority-learning-log.md

  case_sensitive: false
  partial_match: true                      # 부분 일치 허용
  cross_grade_warning: true                # 같은 author가 여러 grade 매칭 시 warning

# ═══════════════════════════════════════════════════════
# 저자 v1 권위 5층 (skeleton.md) 호환 매핑
# ═══════════════════════════════════════════════════════
v1_layer_mapping:
  Layer_1_창업자_증언: A
  Layer_2_미래학자_시스템_사고: B
  Layer_3_인접_학문_통찰: C
  Layer_4_사상가_역사가_진단: D
  Layer_5_역사적_평행: E

