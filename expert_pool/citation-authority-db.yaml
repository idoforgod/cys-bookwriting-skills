# Citation Authority DB
#
# bookwriting의 citation-gate가 출처 *권위 5층 등급*을 매핑할 때 참조하는 DB.
# 저자 v1 권위 5층 (skeleton.md "권위 구조") 그대로 구현.
#
# Grade A = Layer 1 창업자 증언 (가장 강력)
# Grade B = Layer 2 미래학자 시스템 사고 (저자 본인 척추)
# Grade C = Layer 3 인접 학문의 통찰
# Grade D = Layer 4 사상가·역사가의 진단
# Grade E = Layer 5 역사적 평행
# Grade out = 인용 부적합 (블로그·SNS·미검증)

